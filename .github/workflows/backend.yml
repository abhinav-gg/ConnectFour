name: Backend CI & Docker Build

on:
  push:
    branches: [ "main", "staging", "backend" ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ "main", "staging" ]
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/backend.yml'

jobs:
  node-ci:
    name: Node.js Build (Backend)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build --if-present

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: node-ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
            echo "TAG=staging" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Build Docker Image
        run: |
          docker build -f backend.Dockerfile -t connectfour-api:${{ env.TAG }} .

      - name: Tag Image for GHCR
        run: |
          docker tag connectfour-api:${{ env.TAG }} ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/connectfour-api:${{ env.TAG }}

      - name: Push Image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/connectfour-api:${{ env.TAG }}
