name: deploy website

on:
  push:
    branches: [ "main", "staging", "backend" ] 
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+-website*'
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  build-website-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Set tag
        run: |
          if [[ $GITHUB_REF == refs/tags/*-staging ]]; then
            echo "TAG=nightly" >> "$GITHUB_ENV"
          else
            echo "TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Build image locally without GHCR tag
        run: |
          docker-compose -f docker-compose.prod.yml build

      - name: Tag image for GHCR
        run: |
          docker tag connectfour-api:latest ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/connectfour-api:latest

      - name: Push image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ github.repository }}/connectfour-api:latest