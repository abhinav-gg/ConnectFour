# -------------------------------
# Redis Snapshot (RDB) Persistence
# -------------------------------
# Save a snapshot every 15 minutes if at least 1 key changed
save 900 1
# Save every 5 minutes if at least 10 keys changed
save 300 10
# Save every 1 minute if at least 10,000 keys changed
save 60 10000

# -------------------------------
# Append-Only File (AOF) Persistence
# -------------------------------
# Enable AOF for better durability (recommended)
appendonly yes

# Sync AOF to disk every second for balance between durability and performance
appendfsync everysec

# -------------------------------
# Memory Management
# -------------------------------
# Limit max memory to 100mb (adjust based on your EC2 instance RAM and use case)
maxmemory 100mb

# Eviction policy: evict any keys (with or without TTL) using Least Recently Used (LRU) algorithm
# This avoids OOM errors by evicting keys when maxmemory is reached
maxmemory-policy noeviction

# -------------------------------
# Security
# -------------------------------
# Password protection — keep this secure and consistent with your app config
requirepass 9O{6H9519Xf9m%}G0.{[>1sY9

# -------------------------------
# Data Directory
# -------------------------------
# Must match the Docker volume mount to persist data between container restarts
dir /data


# Load Redis Stack modules
loadmodule /opt/redis-stack/lib/redisearch.so
loadmodule /opt/redis-stack/lib/rejson.so
