version: '3.8'

services:
  # Secrets fetcher - only runs in production
  secrets-fetcher:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    container_name: secrets-fetcher
    environment:
      - NODE_ENV=production
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - SECRET_NAME=${SECRET_NAME:-connectfour/production}
    volumes:
      - ./backend:/app/backend
    command: ["node", "/app/backend/config/aws.js"]
    restart: "no"

  # Override redis to depend on secrets-fetcher and use production config
  redis:
    volumes:
      - redis-data:/data
      - ./backend/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $REDIS_PASSWORD ping"]
    depends_on:
      secrets-fetcher:
        condition: service_completed_successfully
  
  # Override api to depend on secrets-fetcher
  api:
    depends_on:
      redis:
        condition: service_healthy
      secrets-fetcher:
        condition: service_completed_successfully

volumes:
  redis-data:
